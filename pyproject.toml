[project]
name = "ai-impact"
version = "0.1.0"
description = "TCC: revisão sistemática sobre impactos da IA no mercado de trabalho"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "networkx>=3.2",
    "sentence-transformers>=2.7",
    "anthropic>=0.34",
    "requests>=2.31",
    "tenacity>=8.2",
    "streamlit>=1.36",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "bibtexparser>=2.0.0b9",
    "langdetect>=1.0.9",
    "pypdf>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
